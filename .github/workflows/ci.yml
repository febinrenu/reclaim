name: CI

on:
  push:
  pull_request:

# A second push should cancel the first run rather than queue behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # The headline job. Note what is NOT here: any secret.
  #
  # Tests pin the local adapters, so CI needs no credentials at all. That is a
  # deliberate property of the architecture rather than a convenience, and it is
  # the same property that lets a stranger clone the repository and run it.
  # ───────────────────────────────────────────────────────────────────────────
  verify:
    name: typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and property tests
        run: npm run test:unit

  # ───────────────────────────────────────────────────────────────────────────
  # The same suite on Windows, because that is the machine this is developed on
  # and the demo is recorded on. Path handling and the forced-kill durability test
  # both behave differently here, so "it works on Linux" is not sufficient evidence.
  # ───────────────────────────────────────────────────────────────────────────
  verify-windows:
    name: unit tests on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  # ───────────────────────────────────────────────────────────────────────────
  # The D2 exit test, run for real in CI rather than only ever by hand: the same
  # repository/worker/webhook integration suite against BOTH drivers. PGlite needs
  # no service at all; node-pg gets a real Postgres service container, per
  # BUILD_PLAN.md §6.10's own instruction ("use a real Postgres in CI, not a
  # mock") for the crash-recovery and concurrent-duplicate-delivery tests
  # specifically — a mock's atomicity is this project's own code, which would
  # make those tests vacuous.
  # ───────────────────────────────────────────────────────────────────────────
  integration:
    name: integration tests, both database drivers
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: reclaim
          POSTGRES_PASSWORD: reclaim_dev_only
          POSTGRES_DB: reclaim
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reclaim -d reclaim"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Integration tests — PGlite (embedded, no DATABASE_URL)
        run: npm run test:integration

      - name: Integration tests — node-pg (real Postgres service container)
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://reclaim:reclaim_dev_only@localhost:5432/reclaim

  build:
    name: production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build

  # ───────────────────────────────────────────────────────────────────────────
  # Secret scan. The pre-commit hook is the first line and is bypassable with
  # --no-verify, so the same check runs here where it cannot be skipped.
  # ───────────────────────────────────────────────────────────────────────────
  secrets:
    name: no credentials in the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Refuse a committed .env
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked by git. Remove it from history and rotate every key it held."
            exit 1
          fi
          echo "no tracked .env"

      - name: Scan tracked files for credential shapes
        # The same scanner the pre-commit hook runs, so there is one pattern list
        # rather than two that drift. --tracked runs the self-test first, which is
        # what makes a clean result meaningful: an earlier shell version of this
        # guard matched nothing at all and still reported success.
        run: node scripts/scan-secrets.mjs --tracked

  # ───────────────────────────────────────────────────────────────────────────
  # Known-CVE dependency scan. SECURITY.md states a real "0 vulnerabilities"
  # result rather than "npm audit was never run" — this is what keeps that a
  # checked fact instead of a one-time snapshot that silently goes stale.
  # `--audit-level=high` fails the build on high/critical only: low/moderate
  # advisories in dev-only tooling should not block a merge, but ship a real
  # exploitable dependency vulnerability never silently.
  # ───────────────────────────────────────────────────────────────────────────
  audit:
    name: dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: npm audit (high and critical)
        run: npm audit --audit-level=high
